name: Deploy Poobalasingham ERP

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Create SSH key file
        shell: bash
        run: |
          printf '%s' "${{ secrets.SSH_PRIVATE_KEY_B64 }}" \
            | base64 --decode > "$RUNNER_TEMP/github_actions_key"
          chmod 600 "$RUNNER_TEMP/github_actions_key"

      - name: Create deployment package
        run: |
          git archive --format=tar.gz -o deploy.tar.gz HEAD

      - name: Copy deployment package to server
        uses: appleboy/scp-action@v1
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key_path: ${{ runner.temp }}/github_actions_key
          source: "deploy.tar.gz"
          target: "/srv/staff/jathursika/Poobalasingham-Book-Depot-deploy"

      - name: Deploy application
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key_path: ${{ runner.temp }}/github_actions_key
          script: |
            set -e

            APP_DIR="/home/jathursika/Poobalasingham-Book-Depot"
            DEPLOY_DIR="/srv/staff/jathursika/Poobalasingham-Book-Depot-deploy"
            ENV_BACKUP="/srv/staff/jathursika/poobalasingham-backend.env"

            if [ -f "$APP_DIR/backend/.env" ]; then
              cp "$APP_DIR/backend/.env" "$ENV_BACKUP"
            fi

            if [ -f "$APP_DIR/docker-compose.yml" ]; then
              cd "$APP_DIR"
              docker compose down || true
            fi

            rm -rf "$APP_DIR"
            mkdir -p "$APP_DIR"

            tar -xzf "$DEPLOY_DIR/deploy.tar.gz" -C "$APP_DIR"

            if [ -f "$ENV_BACKUP" ]; then
              mkdir -p "$APP_DIR/backend"
              cp "$ENV_BACKUP" "$APP_DIR/backend/.env"
            else
              echo "ERROR: Production backend .env was not found."
              exit 1
            fi

            cd "$APP_DIR"
            docker compose up -d --build

            docker ps

            rm -rf "$DEPLOY_DIR"