services:
  backend:
    build:
      context: ./backend
    container_name: poobalasingham-backend
    network_mode: host
    env_file:
      - ./backend/.env
    environment:
      DATABASE_HOST: 127.0.0.1
      DATABASE_PORT: 15432
      PORT: 3050
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
      args:
        NEXT_PUBLIC_API_URL: /api
        NEXT_PUBLIC_API_BASE_URL: /api
    container_name: poobalasingham-frontend
    network_mode: host
    environment:
      PORT: 3040
    depends_on:
      - backend
    restart: unless-stopped